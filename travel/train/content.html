<div class="topic-header"><span class="breadcrumb">Travel / Train</span></div>
<div id="boarding"><div class="pass-main">
<header class="appbar"><div class="brand">Boarding passes</div><button class="button" id="addTripButton" type="button">＋ Add trip</button></header>
<section id="formPanel" class="panel form-panel" aria-labelledby="formTitle" hidden><h2 id="formTitle">Add a trip</h2><form id="pnrForm" novalidate><div class="form-row"><label for="pnrInput" class="visually-hidden">10-digit PNR</label><input id="pnrInput" name="pnr" type="text" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="Enter 10-digit PNR" aria-describedby="pnrError" required><div class="form-actions"><button class="button" type="submit">Submit</button><button class="button secondary" id="sendButton" type="button">Send to Instinct</button></div></div><p id="pnrError" class="form-error" aria-live="polite"></p></form></section>

<script>
'use strict';
const STORE_KEY='pnr-tracker-trips-v1';
const COMPACT_ROUTES={'19489':{name:'Ahmedabad - Gorakhpur Express',from:'ADI · Ahmedabad Jn',to:'BSB · Varanasi Jn',cls:'3A · AC Third AC',coach:'B3',berths:['23','24'],coaches:['LPR','GEN','GEN','H1','A1','A2','B1','B2','B3','B4','M1','M2','S1','S2','S3','S4','S5','S6','S7','GEN','GEN','SLRD'],platformState:'ADI / BSB · ixigo projected, subject to change'}};
// v1 snapshots carry the entire trip; legacy #a snapshots continue to use COMPACT_ROUTES.
const b64uEncode=value=>{const bytes=new TextEncoder().encode(value);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64uDecode=value=>{if(!/^[A-Za-z0-9_-]+$/.test(value)||value.length>10000)throw Error('invalid link code');const padded=value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4);const bin=atob(padded);return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))};
// Build a short PNR-specific WhatsApp handoff; clipboard remains a fallback.
const WHATSAPP_CHAT='https://wa.me/16508702892';
const makeV1Link=values=>{const url='https://schoolofadults.com/travel/train/#b=b1.'+b64uEncode(JSON.stringify(values));if(url.length>2000)throw Error('snapshot link exceeds 2000 characters');return url};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeString=(v,max=140)=>typeof v==='string'?v.slice(0,max):'';
function readTrips(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');return Array.isArray(v)?v.filter(validTrip).map(cleanTrip):[]}catch{return[]}}
function validTrip(t){return t&&typeof t==='object'&&typeof t.pnr==='string'&&t.pnr.length<=24&&typeof t.train==='string'&&t.train.length<=24&&typeof t.endAt==='string'&&Number.isFinite(Date.parse(t.endAt))&&typeof t.from==='string'&&typeof t.to==='string'}
function cleanTrip(t){return{id:safeString(t.id,100)||`${t.pnr}-${t.date||''}`,pnr:safeString(t.pnr,24),train:safeString(t.train,24),name:safeString(t.name,80),cls:safeString(t.cls,60),from:safeString(t.from,100),to:safeString(t.to,100),date:safeString(t.date,80),time:safeString(t.time,40),arrdate:safeString(t.arrdate,80),arrtime:safeString(t.arrtime,40),duration:safeString(t.duration,50),distance:safeString(t.distance,60),platform:safeString(t.platform,60),platformState:safeString(t.platformState,100),coach:safeString(t.coach,16),berths:Array.isArray(t.berths)?t.berths.slice(0,12).map(x=>safeString(x,50)):[],cancel:safeString(t.cancel,100),checked:safeString(t.checked,40),addedAt:safeString(t.addedAt,40)||new Date().toISOString(),coaches:Array.isArray(t.coaches)?t.coaches.slice(0,40).map(x=>safeString(x,16)):[],bookingStatus:safeString(t.bookingStatus,40),berthStatuses:Array.isArray(t.berthStatuses)?t.berthStatuses.slice(0,12).map(x=>safeString(x,24)):[],coachPosition:Number.isInteger(t.coachPosition)?t.coachPosition:0,coachOrderKind:safeString(t.coachOrderKind,16),platformStatus:safeString(t.platformStatus,24),endAt:new Date(t.endAt).toISOString(),sample:false}}
function getSample(){const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const depart=new Date(`${date}T10:08:00+05:30`);const arrive=new Date(`${date}T23:11:00+05:30`);const fmtDate=d=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d);const fmtTime=d=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).format(d);return{sample:true,id:'sample',pnr:'SAMPLE',train:'12345',name:'Train Name',cls:'A1 · AC 1st Class',from:'Station1',to:'Station2',date:fmtDate(depart),time:fmtTime(depart),arrdate:fmtDate(arrive),arrtime:fmtTime(arrive),duration:'13h 03m',distance:'1400 km',platform:'7',platformState:'Fictional sample only',coach:'A1',berths:['21','22'],cancel:'',checked:new Date().toISOString(),addedAt:new Date().toISOString(),coaches:'SLR GEN GEN H1 A1 A2 B1 B2 B3 B4 M1 M2 S1 S2 S3 S4 S5 S6 S7 SLRD'.split(' '),endAt:arrive.toISOString()}}
function stamp(iso){return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'}).format(new Date(iso))+' IST'}
function coachActive(d,c,i){return Number.isInteger(d.coachPosition)&&d.coachPosition>0?i+1===d.coachPosition:c===d.coach}
function ticket(d){const coaches=['ENGINE',...(d.coaches||[])];return `<article class="trip-card"><section class="ticket" aria-label="${esc(d.train)} trip"><section class="top origin"><p class="eyebrow">From · Boarding</p>${d.sample?'':`<button class="icon-button refresh" type="button" aria-label="Refresh PNR status" title="Refresh" data-id="${esc(d.id)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg></button>`}<h1 class="station">${esc(d.from)}</h1><p class="time">${esc(d.time)}</p><p class="daydate">${esc(d.date)}</p></section><section class="details"><p class="eyebrow">Journey details</p><p class="trainno">${esc(d.train)}</p><p class="trainname">${esc(d.name)}</p><p class="classline">CLASS ${esc(d.cls)}</p>${d.sample?'':''}<div class="stats"><div class="stat"><p class="label">Platform</p><p class="value">${esc(d.platform||'Not listed')}</p>${d.sample?'':(d.platformState&&d.platformState.toLowerCase().includes('ixigo')?'':`<p class="note">${esc(d.platformState||'Recheck at station')}</p>`)}</div><div class="berthbox"><div class="coachbig">${esc(d.coach||'—')}</div><div class="berths">${(d.berths||[]).map(b=>`<div>${esc(b)}${d.sample?'':'<span class="check">✓</span>'}</div>`).join('')}</div></div></div><p class="journeyline">${esc(d.duration||'—')}${d.distance?` · ${esc(d.distance)}`:''}</p>${d.cancel?`<div class="cancel">${esc(d.cancel)}</div>`:''}</section><section class="top destination"><p class="eyebrow">To · Arrival</p><h2 class="station">${esc(d.to)}</h2><p class="time">${esc(d.arrtime)}</p><p class="daydate">${esc(d.arrdate)}</p></section><section class="composition" aria-label="Indicative coach order"><div class="engine-block">Engine</div><div class="coachrow">${coaches.slice(1).map((c,i)=>`<div class="block ${coachActive(d,c,i)?'active':''}"><span>${i+1}</span><span>${esc(c)}</span></div>`).join('')}</div></section><footer class="foot"><span>${d.sample?'SAMPLE TRIP':`PNR ${esc(d.pnr)}`}</span><span class="updated">As of ${stamp(d.checked||new Date().toISOString())}</span>${d.sample?'':'<span class="footnote"><strong>Platform</strong> and <strong>coach position</strong> can change, check at station.</span>'}</footer></section><div class="end-actions">${!d.sample&&Date.now()>=Date.parse(d.endAt)?`<button class="button secondary delete" type="button" data-id="${esc(d.id)}">Delete ended trip</button>`:''}</div></article>`}
function saveTrips(trips){localStorage.setItem(STORE_KEY,JSON.stringify(trips))}
function pruneExpired(trips){const cutoff=Date.now()-48*60*60*1000;return trips.filter(t=>Date.parse(t.endAt)>=cutoff)}
function showTrips(){let trips=pruneExpired(readTrips());if(trips.length!==readTrips().length)saveTrips(trips);trips.sort((a,b)=>Date.parse(b.addedAt||b.date)-Date.parse(a.addedAt||a.date));if(!trips.length&&!readCards().length)trips=[getSample()];$('tripList').innerHTML=trips.map(ticket).join('');document.querySelectorAll('.refresh').forEach(b=>b.addEventListener('click',()=>refreshTrip(b.dataset.id)));document.querySelectorAll('.delete').forEach(b=>b.addEventListener('click',()=>deleteTrip(b.dataset.id)));fitStations()}
function fitStations(){document.querySelectorAll('#boarding .station').forEach(s=>{s.style.fontSize='';const w=s.clientWidth;if(!w||s.scrollWidth<=w)return;const cs=parseFloat(getComputedStyle(s).fontSize),ps=parseFloat(getComputedStyle(s.parentElement).fontSize);s.style.fontSize=(cs/ps*(w/s.scrollWidth)*0.97).toFixed(3)+'em'})}
addEventListener('resize',fitStations);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitStations);
function fromCompact(code){if(!code.startsWith('b1.'))throw Error('unsupported link version');const x=JSON.parse(b64uDecode(code.slice(3)));if(!Array.isArray(x)||x.length!==24||x[0]!==1)throw Error('invalid trip payload');const[,pnr,train,name,depart,arrive,fromCode,fromName,toCode,toName,cls,coach,berths,bookingStatus,berthStatuses,departPlatform,arrivalPlatform,platformStatus,coaches,coachPosition,coachOrderKind,distance,durationMinutes,checked]=x;const strings=[pnr,train,name,depart,arrive,fromCode,fromName,toCode,toName,cls,coach,bookingStatus,departPlatform,arrivalPlatform,platformStatus,coachOrderKind,distance,checked];if(strings.some(v=>typeof v!=='string')||!/^\d{10}$/.test(pnr)||!/^\d{5}$/.test(train)||name.length>80||!coach||coach.length>16||![fromCode,toCode,fromName,toName,cls,bookingStatus,departPlatform,arrivalPlatform,platformStatus].every(v=>v.length>0)||fromCode.length>10||toCode.length>10||fromName.length>80||toName.length>80||cls.length>60||bookingStatus.length>40||departPlatform.length>24||arrivalPlatform.length>24||platformStatus.length>24||coachOrderKind.length>16||distance.length>60||!Array.isArray(berths)||berths.length<1||berths.length>12||berths.some(v=>typeof v!=='string'||!v||v.length>40)||!Array.isArray(berthStatuses)||berthStatuses.length!==berths.length||berthStatuses.some(v=>typeof v!=='string'||!v||v.length>24)||!Array.isArray(coaches)||coaches.length<1||coaches.length>40||coaches.some(v=>typeof v!=='string'||!v||v.length>16)||!Number.isInteger(coachPosition)||coachPosition<1||coachPosition>coaches.length||coaches[coachPosition-1]!==coach||!['actual','typical','unverified'].includes(coachOrderKind)||!Number.isInteger(durationMinutes)||durationMinutes<0||durationMinutes>200000||durationMinutes!==Math.round((new Date(arrive)-new Date(depart))/60000))throw Error('invalid trip fields');const dep=new Date(depart),arr=new Date(arrive),asof=new Date(checked);if(!Number.isFinite(+dep)||!Number.isFinite(+arr)||!Number.isFinite(+asof)||arr<=dep||dep.toISOString()!==depart||arr.toISOString()!==arrive||asof.toISOString()!==checked)throw Error('invalid trip times');const fmtDate=d=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d),fmtTime=d=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).format(d);return cleanTrip({sample:false,id:`pnr-${pnr}-${depart}`,pnr,train,name,cls,from:`${fromCode} · ${fromName}`,to:`${toCode} · ${toName}`,date:fmtDate(dep),time:fmtTime(dep),arrdate:fmtDate(arr),arrtime:fmtTime(arr),duration:`${Math.floor(durationMinutes/60)}h ${String(durationMinutes%60).padStart(2,'0')}m`,distance,platform:`${departPlatform} / ${arrivalPlatform}`,platformState:platformStatus,coach,berths,bookingStatus,berthStatuses,coaches,coachPosition,coachOrderKind,cancel:'',checked:asof.toISOString(),addedAt:new Date().toISOString(),endAt:arr.toISOString()})}
function fromLegacyCompact(code){const parts=code.split('.');if(parts.length!==7||parts[0]!=='1')throw Error('invalid compact trip');const[,pnr,train,depart,arrive,checked,platform]=parts;if(!/^\d{10}$/.test(pnr)||!/^\d{5}$/.test(train)||!/^[0-9a-z]+$/i.test(depart+arrive+checked))throw Error('invalid compact fields');const r=COMPACT_ROUTES[train];if(!r)throw Error('unknown route');const dep=new Date(parseInt(depart,36)*60000),arr=new Date(parseInt(arrive,36)*60000),asof=new Date(parseInt(checked,36)*60000);if(!Number.isFinite(dep.getTime())||!Number.isFinite(arr.getTime())||!Number.isFinite(asof.getTime())||arr<=dep)throw Error('invalid trip time');if(train==='19489'&&(depart!=='hsfq4'||arrive!=='hsgze'||checked!=='hse7w'||platform!=='8-3'||pnr!=='8752640193'))throw Error('invalid compact PNR snapshot');const fmtDate=d=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d);const fmtTime=d=>new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).format(d);const durationMinutes=Math.round((arr-dep)/60000),duration=`${Math.floor(durationMinutes/60)}h ${String(durationMinutes%60).padStart(2,'0')}m`;return{sample:false,id:`pnr-${pnr}-${dep.toISOString()}`,pnr,train,name:r.name,cls:r.cls,from:r.from,to:r.to,date:fmtDate(dep),time:fmtTime(dep),arrdate:fmtDate(arr),arrtime:fmtTime(arr),duration,distance:'',platform:platform.replace('-', ' / '),platformState:r.platformState,coach:r.coach,berths:r.berths,cancel:'',checked:asof.toISOString(),addedAt:new Date().toISOString(),coaches:r.coaches,endAt:arr.toISOString()}}
function importLink(){if(!location.hash.startsWith('#add=')&&!location.hash.startsWith('#a=')&&!location.hash.startsWith('#b='))return;try{if(location.href.length>2000)throw Error('Link is too large');if(location.hash.startsWith('#b=')){const imported=fromCompact(decodeURIComponent(location.hash.slice(3)));const current=readTrips();const existing=current.some(t=>t.pnr===imported.pnr&&t.train===imported.train&&t.date===imported.date);if(!existing){current.unshift(imported);saveTrips(current)}history.replaceState(null,'',location.pathname+location.search);$('tripList').setAttribute('data-imported','true');showTrips();return}let trip;if(location.hash.startsWith('#add=')){const raw=decodeURIComponent(location.hash.slice(5));if(raw.length>18000)throw Error('Link is too large');const payload=JSON.parse(raw);if(payload.version!==1||!validTrip(payload.trip))throw Error('This trip link is not valid');trip=cleanTrip({...payload.trip,addedAt:new Date().toISOString()})}else if(location.hash.startsWith('#b=')){trip=fromCompact(decodeURIComponent(location.hash.slice(3)))}else trip=cleanTrip(fromLegacyCompact(decodeURIComponent(location.hash.slice(3))));const trips=readTrips().filter(t=>!(t.pnr===trip.pnr&&t.train===trip.train&&t.date===trip.date));trips.unshift(trip);saveTrips(trips);history.replaceState(null,'',location.pathname+location.search);$('tripList').setAttribute('data-imported','true');showTrips()}catch(e){$('tripList').innerHTML='<section class=\"panel\" role=\"alert\"><strong>Could not add this trip.</strong><p>The snapshot link is damaged or not in the supported format. Ask me for a fresh link.</p></section>';history.replaceState(null,'',location.pathname+location.search)}}
function copyThenOpen(text){const target=WHATSAPP_CHAT+'?text='+encodeURIComponent(text);const opened=window.open(target,'_blank','noopener,noreferrer');if(!opened)location.href=target;const fallback=()=>{const done=()=>{const note=$('copyStatus');if(note)note.textContent='Request copied. Paste it into WhatsApp if the message was not prefilled.'};const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy');done()}catch{}ta.remove()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(fallback);else fallback()}
function refreshTrip(id){const t=readTrips().find(x=>x.id===id);if(!t||!/^\d{10}$/.test(t.pnr))return;copyThenOpen(`Refresh PNR ${t.pnr}`)}
function deleteTrip(id){const t=readTrips().find(x=>x.id===id);if(!t||Date.now()<Date.parse(t.endAt))return;if(!confirm(`Delete the ended trip ${t.train} (${t.date}) from this device?`))return;saveTrips(readTrips().filter(x=>x.id!==id));showTrips()}
$('addTripButton').addEventListener('click',()=>{$('formPanel').hidden=!$('formPanel').hidden;if(!$('formPanel').hidden)$('pnrInput').focus()});
const CARD_KEY='sofa-train-pnr-cards-v1';
function readCards(){try{const v=JSON.parse(localStorage.getItem(CARD_KEY)||'[]');return Array.isArray(v)?v.filter(c=>c&&/^\d{10}$/.test(c.pnr)):[]}catch{return[]}}
function saveCards(c){try{localStorage.setItem(CARD_KEY,JSON.stringify(c))}catch{}}
function showCards(){const cards=readCards(),box=$('pnrCards');box.hidden=!cards.length;box.innerHTML=cards.length?'<h2>Saved PNRs</h2>'+cards.map(c=>`<div class="pnr-card"><a href="https://www.ixigo.com/trains/pnr-status/${esc(c.pnr)}" target="_blank" rel="noopener noreferrer"><span class="pnr-no">PNR ${esc(c.pnr)}</span><span class="pnr-open">Open status on ixigo ↗</span></a><button type="button" class="remove" data-pnr="${esc(c.pnr)}" aria-label="Remove PNR ${esc(c.pnr)}">Remove</button></div>`).join(''):'';box.querySelectorAll('.remove').forEach(b=>b.addEventListener('click',()=>{saveCards(readCards().filter(c=>c.pnr!==b.dataset.pnr));showCards();showTrips()}))}
function readPnr(){const pnr=$('pnrInput').value.replace(/\D/g,'');if(!/^\d{10}$/.test(pnr)){$('pnrError').textContent='Enter a valid 10-digit PNR.';return null}$('pnrError').textContent='';return pnr}
$('pnrForm').addEventListener('submit',e=>{e.preventDefault();const pnr=readPnr();if(!pnr)return;const cards=readCards().filter(c=>c.pnr!==pnr);cards.unshift({pnr,addedAt:new Date().toISOString()});saveCards(cards.slice(0,20));$('pnrInput').value='';showCards();showTrips()});
$('sendButton').addEventListener('click',()=>{const pnr=readPnr();if(!pnr)return;copyThenOpen(`Take this PNR ${pnr}, and all the instructions are given on this link: https://schoolofadults.com/travel/train/train.md`)});
function boot(){showCards();importLink();if(!$('tripList').hasAttribute('data-imported'))showTrips();const q=new URLSearchParams(location.search);if(q.get('add')==='1'){$('formPanel').hidden=false;$('pnrInput').focus()}setInterval(()=>{const trips=pruneExpired(readTrips());if(trips.length!==readTrips().length){saveTrips(trips);showTrips()}},60000)}
boot();
</script>
